server {
    listen 80;
    server_name localhost;

    # 前端静态资源 (Vue/React 打包后的页面)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 解决 SPA 刷新 404
    }

    # 1. 代理 API 接口
    location /api/v1/ {
        # 注意：proxy_pass 末尾是否有斜杠，视后端路由而定。
        # 这里保留 /api/v1/ 路径直接透传
        proxy_pass http://app:3000/api/v1/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 跨域请求时需要的头（如果前端和后端在同域名下，实际上不需要 Cors，但保留更稳妥）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }

    # 2. 代理静态资源 (如图片、上传文件)
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        
        # 静态资源可以设置较长的缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_set_header Host $host;
    }

    # 3. 代理 WebSocket
    location /ws {
        proxy_pass http://app:3000/ws;
        
        # WebSocket 核心配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 防止 WebSocket 频繁断开（设置较长超时时间）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}