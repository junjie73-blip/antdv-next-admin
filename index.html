<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title><%= VITE_APP_TITLE %></title>

    <!-- ==================== SEO 基础标签 ==================== -->
    <meta name="description" content="Antdv Next Vue Admin - 基于 Vue 3 + TypeScript + Antdv Next 的现代化后台管理系统模板，支持暗色模式、国际化、RBAC 权限控制，开箱即用的企业级解决方案。" />
    <meta name="keywords" content="Antdv Next, Vue Admin, Vue3, TypeScript, 后台管理系统, Admin Template, 企业级应用, RBAC权限" />
    <meta name="author" content="Antdv Next Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="<%= VITE_APP_BASE_URL || 'https://example.com' %>" />

    <!-- ==================== 移动端优化 ==================== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="<%= VITE_APP_TITLE %>" />

    <meta name="theme-color" content="#1677ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />

    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ==================== Open Graph 社交媒体标签 ==================== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<%= VITE_APP_TITLE %>" />
    <meta property="og:description" content="基于 Vue 3 + Antdv Next 的现代化后台管理系统，支持暗色模式、国际化、RBAC 权限控制。" />
    <meta property="og:url" content="<%= VITE_APP_BASE_URL || 'https://example.com' %>" />
    <meta property="og:site_name" content="<%= VITE_APP_TITLE %>" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="<%= VITE_APP_TITLE %> - 现代化后台管理系统" />
    <meta property="og:image:type" content="image/png" />

    <!-- ==================== Twitter Card 标签 ==================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= VITE_APP_TITLE %>" />
    <meta name="twitter:description" content="基于 Vue 3 + Antdv Next 的现代化后台管理系统，支持暗色模式、国际化、RBAC 权限控制。" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:site" content="@antdv_next" />
    <meta name="twitter:creator" content="@antdv_next" />

    <!-- ==================== 其他实用标签 ==================== -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="<%= VITE_APP_TITLE %>" />
    <meta name="msapplication-TileColor" content="#1677ff" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />

    <!-- DNS 预解析（加速外部资源加载） -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

    <!-- ==================== 安全防护头 ==================== -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline' data: blob: https://cdn.jsdelivr.net;
               img-src 'self' data: https: blob:;
               font-src 'self' data: https://fonts.gstatic.com;
               connect-src 'self' https: blob: data:;
               frame-src 'self' http://localhost:* https: blob:;
               form-action 'self';
               base-uri 'self';
               object-src 'none';
               worker-src 'self' blob: data:;
               upgrade-insecure-requests;" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!--
      ⚠️ X-Frame-Options 注意事项：
      X-Frame-Options 不能通过 <meta> 标签设置！浏览器会忽略它。
      正确方式：通过 HTTP 响应头或 Vite 开发服务器中间件设置。
      当前已通过 CSP 的 frame-src 指令提供等效保护。
    -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
