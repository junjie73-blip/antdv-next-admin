<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1677ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4096ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1677ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 抽象 A 字母图标 -->
  <g transform="translate(4, 5)">
    <!-- 外框圆角矩形 -->
    <rect x="2" y="2" width="36" height="36" rx="8" ry="8" fill="url(#iconGrad)" opacity="0.1"/>
    <!-- A 字母几何形状 -->
    <path d="M20 8 L10 32 L14 32 L17 25 L27 25 L30 32 L34 32 L24 8 Z M18.5 21 L22 13 L25.5 21 Z"
          fill="url(#iconGrad)"/>
    <!-- 装饰点 -->
    <circle cx="30" cy="12" r="2.5" fill="#1677ff" opacity="0.6"/>
  </g>

  <!-- 文字部分 -->
  <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="15" font-weight="700" fill="url(#textGrad)">Antdv Next</text>
  <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="9" font-weight="400" fill="#8c8c8c" letter-spacing="1">Vue Admin</text>
</svg>
